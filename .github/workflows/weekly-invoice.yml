name: Weekly invoices

on:
  schedule:
    - cron: '0 17 * * 0'   # every Sunday at 17:00 UTC, which is 19:00 in South Africa
  workflow_dispatch:        # also adds a "Run workflow" button, for testing

jobs:
  create-invoices:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to create this week's invoices
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Key: $CRON_KEY" \
            "$APP_URL/cron_invoices.php"
